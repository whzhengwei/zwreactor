name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 静态站点无需构建：只把真正要发布的文件挑到 dist/，
      # 避免把 .git / .github / 脚本 / Markdown 说明文档当成静态资源上传。
      - name: Stage static files
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='scripts' \
            --exclude='*.md' \
            --exclude='*.py' \
            ./ dist/
          echo "--- staged files ---"
          find dist -type f | wc -l
          du -sh dist

      - name: Cloudflare inventory (diagnostic)
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok = os.environ["CF_TOKEN"]
          acct = os.environ["CF_ACCOUNT"]
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                                           headers={"Authorization": "Bearer " + tok})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except Exception as e:
                  return {"error": str(e)}
          print("=== ZONES ===")
          z = get("/zones?per_page=50")
          for r in (z.get("result") or []):
              print(r["name"], "| zone", r["id"], "| account", r["account"]["id"], r["account"]["name"])
          if z.get("error"):
              print("zones error:", z["error"])
          print("=== PAGES PROJECTS ===")
          print(json.dumps(get("/accounts/" + acct + "/pages/projects?per_page=50"), indent=1)[:1500])
          print("=== WORKERS SCRIPTS ===")
          print(json.dumps(get("/accounts/" + acct + "/workers/scripts"), indent=1)[:1500])
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zhengwei-machinery --branch=main
        continue-on-error: true
